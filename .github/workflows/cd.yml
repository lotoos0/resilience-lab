name: CD
on:
  push:
    branches: [main, develop]
    tags: ['v*']
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine image tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push API
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/resilience-lab-api:${{ steps.tag.outputs.value }} -f services/api/Dockerfile .
          docker tag ghcr.io/${{ github.repository_owner }}/resilience-lab-api:${{ steps.tag.outputs.value }} ghcr.io/${{ github.repository_owner }}/resilience-lab-api:latest
          docker push ghcr.io/${{ github.repository_owner }}/resilience-lab-api:${{ steps.tag.outputs.value }}
          docker push ghcr.io/${{ github.repository_owner }}/resilience-lab-api:latest
      - name: Build and Push Payments
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/resilience-lab-payments:${{ steps.tag.outputs.value }} -f services/payments/Dockerfile .
          docker tag ghcr.io/${{ github.repository_owner }}/resilience-lab-payments:${{ steps.tag.outputs.value }} ghcr.io/${{ github.repository_owner }}/resilience-lab-payments:latest
          docker push ghcr.io/${{ github.repository_owner }}/resilience-lab-payments:${{ steps.tag.outputs.value }}
          docker push ghcr.io/${{ github.repository_owner }}/resilience-lab-payments:latest

