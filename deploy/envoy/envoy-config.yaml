apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: resilience-lab
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901
    static_resources:
      listeners:
        - name: listener_0
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 10000
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    codec_type: AUTO
                    common_http_protocol_options:
                      idle_timeout: 60s
                      max_connection_duration: 300s
                    request_timeout: 10s
                    stream_idle_timeout: 300s
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: backend
                          domains: ["*"]
                          routes:
                            # API routes
                            - match:
                                prefix: "/api"
                              route:
                                cluster: api_service
                                timeout: 10s
                                idle_timeout: 60s
                                regex_rewrite:
                                  pattern:
                                    regex: "^/api"
                                  substitution: ""
                                retry_policy:
                                  retry_on: "5xx,reset,connect-failure,refused-stream"
                                  num_retries: 2
                                  per_try_timeout: 2s
                            # Payments routes
                            - match:
                                prefix: "/payments"
                              route:
                                cluster: payments_service
                                timeout: 10s
                                idle_timeout: 60s
                                regex_rewrite:
                                  pattern:
                                    regex: "^/payments"
                                  substitution: ""
                                retry_policy:
                                  retry_on: "5xx,reset,connect-failure,refused-stream"
                                  num_retries: 2
                                  per_try_timeout: 2s
                            # Health check route
                            - match:
                                prefix: "/healthz"
                              route:
                                cluster: api_service
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        # API service cluster
        - name: api_service
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          connect_timeout: 0.5s
          circuit_breakers:
            thresholds:
              - priority: DEFAULT
                max_connections: 5
                max_pending_requests: 5
                max_requests: 10
                max_retries: 3
          load_assignment:
            cluster_name: api_service
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: resilience-lab-api
                          port_value: 8000
          health_checks:
            - timeout: 1s
              interval: 5s
              unhealthy_threshold: 2
              healthy_threshold: 2
              http_health_check:
                path: "/healthz"
          common_http_protocol_options:
            idle_timeout: 60s
          # Retry policy
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http_protocol_options: {}
          outlier_detection:
            consecutive_5xx: 3
            interval: 10s
            base_ejection_time: 30s
            max_ejection_percent: 50
            enforcing_consecutive_5xx: 100
            enforcing_success_rate: 100
            success_rate_minimum_hosts: 2
            success_rate_request_volume: 10
            success_rate_stdev_factor: 1900
        # Payments service cluster
        - name: payments_service
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          connect_timeout: 0.5s
          circuit_breakers:
            thresholds:
              - priority: DEFAULT
                max_connections: 5
                max_pending_requests: 5
                max_requests: 10
                max_retries: 3
          load_assignment:
            cluster_name: payments_service
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: resilience-lab-payments
                          port_value: 8001
          health_checks:
            - timeout: 1s
              interval: 5s
              unhealthy_threshold: 2
              healthy_threshold: 2
              http_health_check:
                path: "/healthz"
          common_http_protocol_options:
            idle_timeout: 60s
          # Retry policy
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http_protocol_options: {}
          outlier_detection:
            consecutive_5xx: 3
            interval: 10s
            base_ejection_time: 30s
            max_ejection_percent: 50
            enforcing_consecutive_5xx: 100
            enforcing_success_rate: 100
            success_rate_minimum_hosts: 2
            success_rate_request_volume: 10
            success_rate_stdev_factor: 1900
