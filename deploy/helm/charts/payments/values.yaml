replicaCount: 2
image:
  repository: resilience-lab-payments
  tag: local
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8001
env:
  - name: DATABASE_URL
    value: ""
  - name: REDIS_URL
    value: ""
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
startupProbe:
  httpGet:
    path: /healthz
    port: 8001
  failureThreshold: 30
  periodSeconds: 10
livenessProbe:
  httpGet:
    path: /healthz
    port: 8001
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /healthz
    port: 8001
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
chaosMode:
  netAdmin: false   # Add NET_ADMIN capability. Enable only during chaos experiments.
  runAsRoot: false  # Switch to runAsUser: 0. Enable only if tc fails with permission errors at Stage 1.
