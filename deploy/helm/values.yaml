# Global configuration
global:
  imageRegistry: ghcr.io
  imageRepository: lotoos0/resilience-lab
  imagePullPolicy: IfNotPresent
  storageClass: standard
# PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    username: resilience
    password: resilience
    database: resilience_db
  primary:
    persistence:
      enabled: true
      size: 1Gi
# Redis configuration
# Plain Deployment+Service (deploy/helm/templates/redis-*.yaml), not a Bitnami
# subchart: the rate-limit middleware only needs an atomic shared store for
# sliding-window counters (ephemeral by nature, TTL = 60s), so an emptyDir is
# enough — no persistence/auth/replication required.
redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
# API service configuration
api:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/lotoos0/resilience-lab-api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  env:
    - name: DATABASE_URL
      value: "postgresql://resilience:resilience@postgresql:5432/resilience_db"
    - name: REDIS_URL
      value: "redis://redis:6379"
    - name: PAYMENTS_URL
      value: "http://resilience-lab-payments:8001"
# Payments service configuration
payments:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/lotoos0/resilience-lab-payments
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8001
  env:
    - name: DATABASE_URL
      value: "postgresql://resilience:resilience@postgresql:5432/resilience_db"
    - name: REDIS_URL
      value: "redis://redis:6379"
