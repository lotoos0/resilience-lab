apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: resilience-lab-rules
  namespace: monitoring
  labels:
    release: prometheus  # Required for kube-prometheus-stack
spec:
  groups:
    # Envoy metrics - these will work immediately
    - name: envoy_metrics
      interval: 30s
      rules:
        # Request rate per cluster
        - record: envoy:http_requests:rate5m
          expr: rate(envoy_cluster_upstream_rq_total[5m])

        # Error rate (5xx responses)
        - record: envoy:http_errors_5xx:rate5m
          expr: rate(envoy_cluster_upstream_rq_xx{envoy_response_code_class="5"}[5m])

        # Request duration p95
        - record: envoy:http_request_duration:p95
          expr: histogram_quantile(0.95, rate(envoy_cluster_upstream_rq_time_bucket[5m]))

        # Upstream connection pool
        - record: envoy:upstream_connections:current
          expr: envoy_cluster_upstream_cx_active

    # API metrics - will work when /metrics endpoint is available
    - name: api_metrics
      interval: 30s
      rules:
        # HTTP request rate
        - record: api:http_requests:rate5m
          expr: rate(http_requests_total{job="resilience-lab-api"}[5m])

        # HTTP error rate (5xx)
        - record: api:http_errors:rate5m
          expr: rate(http_requests_total{job="resilience-lab-api",status=~"5.."}[5m])

        # Rate limiting denied requests
        - record: api:rate_limit_denied:rate5m
          expr: rate(rl_denied_total[5m])

        # Rate limiting allowed requests
        - record: api:rate_limit_allowed:rate5m
          expr: rate(rl_allowed_total[5m])

    # System health metrics
    - name: system_health
      interval: 30s
      rules:
        # Pod availability
        - record: resilience_lab:pod_available:count
          expr: count(up{namespace="resilience-lab"} == 1)

        # Total pods
        - record: resilience_lab:pod_total:count
          expr: count(up{namespace="resilience-lab"})

        # Availability ratio
        - record: resilience_lab:availability:ratio
          expr: |
            resilience_lab:pod_available:count
            /
            resilience_lab:pod_total:count

    # Basic v0.1.0 alerting baseline
    - name: resilience_lab_alerts
      interval: 30s
      rules:
        # API 5xx ratio is above 5% while the API is receiving traffic.
        - alert: HighErrorRate
          expr: |
            (
              sum(rate(http_requests_total{job="resilience-lab-api",status=~"5..|5xx"}[5m]))
              /
              clamp_min(sum(rate(http_requests_total{job="resilience-lab-api"}[5m])), 0.001)
            ) > 0.05
            and
            sum(rate(http_requests_total{job="resilience-lab-api"}[5m])) > 0.1
          for: 5m
          labels:
            severity: warning
            service: api
          annotations:
            summary: "High API error rate"
            description: "More than 5% of API requests have returned 5xx responses for 5 minutes."

        # The API metrics target is down or unreachable.
        - alert: APIDown
          expr: |
            up{job="resilience-lab-api"} == 0
            or
            absent(up{job="resilience-lab-api"})
          for: 1m
          labels:
            severity: critical
            service: api
          annotations:
            summary: "API target is down"
            description: "Prometheus cannot scrape the resilience-lab API target."

        # Any scrape target in the resilience-lab namespace is down.
        - alert: PrometheusTargetDown
          expr: |
            up{namespace="resilience-lab"} == 0
            or
            absent(up{namespace="resilience-lab"})
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Prometheus target is down"
            description: "Prometheus target {{ $labels.job }} / {{ $labels.instance }} in namespace {{ $labels.namespace }} has been down for more than 2 minutes."
