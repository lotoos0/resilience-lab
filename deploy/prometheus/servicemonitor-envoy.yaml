apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: envoy-proxy-metrics
  namespace: monitoring
  labels:
    app: envoy-proxy
    release: prometheus  # Required for kube-prometheus-stack to discover this ServiceMonitor
spec:
  # Select the Envoy service in resilience-lab namespace
  selector:
    matchLabels:
      app: envoy-proxy
  # Look for services in resilience-lab namespace
  namespaceSelector:
    matchNames:
      - resilience-lab
  # Scrape configuration
  endpoints:
    - port: admin  # Envoy admin port (9901)
      path: /stats/prometheus
      interval: 30s
      scrapeTimeout: 10s
