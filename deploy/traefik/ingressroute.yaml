---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: resilience-lab-web
  namespace: resilience-lab
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`resilience-lab.local`)
      kind: Rule
      services:
        - name: envoy-proxy
          port: 80

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: resilience-lab-websecure
  namespace: resilience-lab
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`resilience-lab.local`)
      kind: Rule
      services:
        - name: envoy-proxy
          port: 80
  tls:
    secretName: resilience-lab-tls
